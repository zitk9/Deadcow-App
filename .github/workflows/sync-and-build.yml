name: Sync Upstream & Build Deadcow APK

on:
  schedule:
    # Check for upstream updates every night at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force pull and merge latest upstream commits'
        required: false
        type: boolean
        default: false
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Official Upstream
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.sync_step.outputs.has_updates }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Check Upstream
        id: sync_step
        run: |
          echo "Adding upstream remote..."
          git remote add upstream https://github.com/unvoiddd/Dolphy-App.git || git remote set-url upstream https://github.com/unvoiddd/Dolphy-App.git
          git fetch upstream main || git fetch upstream master || true

          UPSTREAM_BRANCH="main"
          if ! git rev-parse upstream/main >/dev/null 2>&1; then
            UPSTREAM_BRANCH="master"
          fi

          # Check if upstream has new commits not yet merged into HEAD
          UPSTREAM_NEW_COMMITS=$(git rev-list HEAD..upstream/${UPSTREAM_BRANCH} --count || echo "0")
          echo "New upstream commits: $UPSTREAM_NEW_COMMITS"

          if [ "$UPSTREAM_NEW_COMMITS" -gt 0 ] || [ "${{ github.event.inputs.force_sync }}" == "true" ]; then
            echo "Attempting to merge upstream/${UPSTREAM_BRANCH}..."
            git merge upstream/${UPSTREAM_BRANCH} -m "chore(sync): merge upstream changes from official repo" || {
              echo "Resolving merge conflicts favoring Deadcow customizations..."
              git checkout --ours .
              git add -A
              git commit -m "chore(sync): resolve upstream merge keeping Deadcow customizations"
            }

            echo "Auto-bumping versionCode and versionName after upstream sync..."
            OLD_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "28")
            NEW_CODE=$((OLD_CODE + 1))
            OLD_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.2")
            MAJOR=$(echo "$OLD_NAME" | cut -d. -f1)
            MINOR=$(echo "$OLD_NAME" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            NEW_NAME="${MAJOR}.${NEW_MINOR}"
            sed -i "s/versionCode = ${OLD_CODE}/versionCode = ${NEW_CODE}/" app/build.gradle.kts
            sed -i "s/versionName = \"${OLD_NAME}\"/versionName = \"${NEW_NAME}\"/" app/build.gradle.kts
            git add app/build.gradle.kts
            git commit -m "chore(release): auto-bump version to v${NEW_NAME} (${NEW_CODE}) after upstream sync" || true

            git push origin main || echo "No changes to push or push not allowed."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date with upstream."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

          # Also auto-bump version if the push came from main without a manual versionCode bump compared to HEAD~1
          if [ "${{ github.event_name }}" == "push" ]; then
            PREV_CODE=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep -oP 'versionCode\s*=\s*\K\d+' || echo "0")
            CURR_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "28")
            if [ "$PREV_CODE" == "$CURR_CODE" ] && [ "$CURR_CODE" != "0" ]; then
              NEW_CODE=$((CURR_CODE + 1))
              sed -i "s/versionCode = ${CURR_CODE}/versionCode = ${NEW_CODE}/" app/build.gradle.kts
              git add app/build.gradle.kts
              git commit -m "chore(release): auto-increment versionCode to ${NEW_CODE} [skip ci]" || true
              git push origin main || true
            fi
          fi

  build:
    name: Build Deadcow Android APK
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: |
          set +e
          set +o pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Starting Gradle build ($BUILD_TYPE)..."
          BUILD_SUCCESS=false

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log
            if [ ${PIPESTATUS[0]} -eq 0 ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              cp app/build/outputs/apk/debug/app-debug.apk Deadcow-debug.apk
              echo "APK_PATH=Deadcow-debug.apk" >> "$GITHUB_ENV"
              BUILD_SUCCESS=true
            fi
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build_output.log
            if [ ${PIPESTATUS[0]} -eq 0 ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
              cp app/build/outputs/apk/release/app-release.apk Deadcow-release.apk
              echo "APK_PATH=Deadcow-release.apk" >> "$GITHUB_ENV"
              BUILD_SUCCESS=true
            else
              echo "Release minification failed, attempting debug APK build..."
              ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build_output.log
              if [ ${PIPESTATUS[0]} -eq 0 ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
                cp app/build/outputs/apk/debug/app-debug.apk Deadcow-release.apk
                echo "APK_PATH=Deadcow-release.apk" >> "$GITHUB_ENV"
                BUILD_SUCCESS=true
              fi
            fi
          fi

          if [ "$BUILD_SUCCESS" = "false" ]; then
            echo "ERROR: Gradle compilation failed to produce a Deadcow APK." >&2
            exit 1
          fi
          echo "APK successfully prepared at Deadcow-release.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Build Logs on Failure
        if: failure()
        run: |
          if [ -f build_output.log ]; then
            echo "=== Gradle Build Logs (Failure) ==="
            tail -n 250 build_output.log
          fi

      - name: Push Build Log to Branch on Failure
        if: failure()
        run: |
          if [ -f build_output.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-log
            git add -f build_output.log
            git commit -m "chore(ci): build failure log [skip ci]" || true
            git push origin build-log --force || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Deadcow-Build-Log
          path: build_output.log
          retention-days: 7

      - name: Extract App Version & Generate version.json
        if: success()
        id: app_version
        run: |
          VER_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "28")
          VER_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.2")
          TAG_NAME="v${VER_NAME}-b${VER_CODE}"
          echo "ver_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "ver_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          cat <<EOF > version.json
          {
            "versionCode": ${VER_CODE},
            "versionName": "${VER_NAME}",
            "tagName": "${TAG_NAME}",
            "apkUrl": "https://github.com/zitk9/Deadcow-App/releases/download/${TAG_NAME}/Deadcow-release.apk"
          }
          EOF
          cat version.json

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Deadcow-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish Auto-Update Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag_name }}
          name: "Deadcow v${{ steps.app_version.outputs.ver_name }} (Build ${{ steps.app_version.outputs.ver_code }})"
          prerelease: false
          make_latest: true
          body: |
            ### 🐮 Deadcow Android Release v${{ steps.app_version.outputs.ver_name }} (Build ${{ steps.app_version.outputs.ver_code }})

            - **Nom** : Deadcow
            - **Version** : v${{ steps.app_version.outputs.ver_name }} (`versionCode = ${{ steps.app_version.outputs.ver_code }}`)
            - **Mise à jour automatique** : L'application Deadcow détecte et installe automatiquement cette mise à jour au lancement.
            - **Langue par défaut** : Français (Support complet Français, Anglais, Russe).
            - **Mascotte** : Vache Deadcow (Animations 128x64, Level Up, Portraits Passeport, NFC/RFID/IR/BLE).
            - **Correctifs & Nouveautés (v1.15)** :
              * **Classement Cyber Réel & Paliers** : Suppression intégrale des faux profils bots ; détail transparent des points gagnés par activité (BLE, BadUSB, NFC, IR, NRF, Wi-Fi) et découverte des pairs décentralisés.
              * **Chat Bluetooth BLE fiabilisé** : Correction du dépassement de paquet (31 octets) avec scan response, persistance locale des messages et support Android 13+.
              * **Débridage Trottinettes jusqu'à 100 km/h** : Calcul dynamique du checksum Ninebot, presets Boost 45 km/h et Max 100 km/h, avec curseur interactif 15-100 km/h et télémétrie de batterie.
              * **Débit Réseau en Gbps** : Affichage automatique en Gbps (> 1000 Mbps) et Go transférés, avec 16 flux de test très haut débit (serveurs Cloudflare et OVH).
              * **Installation / Mise à jour APK Deadcow Tool** : Correction Scoped Storage Android 11-15 via cache-path FileProvider, résolution des erreurs d'installation et support d'ouverture d'APK direct avec requêtes de paquets dans le Manifest.
              * **CamWatch & Recherche de Caméras** : Traduction intégrale en français de tous les journaux et erreurs, sélection prioritaire wlan0 et flux MJPEG/RTSP/Snapshots.
              * **Scanner Bluetooth précis (Fin des Unknown)** : Correction du parseur OUI de 50 000 constructeurs, intégration des identifiants Bluetooth SIG et cascade de nommage détaillée.
              * **Smart Cast TV** : Résolution du plantage NsdManager (écouteurs distincts par service), découverte SSDP/DLNA/UPnP pour télés Samsung, LG, Sony, Roku, sélection IP Wi-Fi et repli de port dynamique.
              * **Clavier Bluetooth HID** : Mode portrait droit naturel sans distorsion 90°, bouton de rotation optionnel, champ de saisie directe au clavier virtuel et alternance Pavé tactile/Clavier sur mobile.
              * **Détection NFC Enrichie & Cartes CB** : Détection des Cartes Bancaires françaises (CB), Visa, Mastercard, Amex, et normalisation Mir.
              * **Localisation & Ergonomie du Menu** : En-têtes du menu d'outils traduits en français (Infrarouge, Bluetooth, Autres outils, Plugins).
            - **APK officiel Deadcow** : Téléchargez `Deadcow-release.apk` ci-dessous.
          files: |
            Deadcow-release.apk
            version.json
            build_output.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Documentation to gh-pages
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -f version.json docs/version.json || true
          git add -f docs/version.json || true
          git commit -m "chore(pages): add version.json [skip ci]" || true
          TREE=$(git rev-parse HEAD:docs)
          COMMIT=$(git commit-tree "$TREE" -m "chore(pages): deploy website and version.json from main docs [skip ci]")
          git push origin "$COMMIT":refs/heads/gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
